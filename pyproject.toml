[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dde"
version = "0.1.0"
description = "Deep Discrete Encoder models"
readme = "README.md"
requires-python = ">=3.9"
authors = [
  { name = "DDE contributors" }
]
dependencies = [
  "numpy",
  "scipy",
  "scikit-learn",
  "joblib",
]

[project.optional-dependencies]
init = [
  "factor-analyzer",
]
dev = [
  "pytest",
]
viz = [
  "matplotlib",
  "pandas",
]

[tool.setuptools.packages.find]
where = ["src"]
